# Production on a server: adds Caddy in front of the website for HTTPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Needs DOMAIN in .env, and the domain's A records pointing at this server.

services:
  frontend:
    # Only Caddy talks to the website; it is not published on its own port.
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, for example signaturemile.com}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
